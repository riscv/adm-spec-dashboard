name: Tests

on:
  pull_request:
    paths:
      - ai-summaries.py
      - spec-activity.py
      - staff.json
      - tests/**
      - .github/workflows/tests.yaml
  push:
    branches: [main]
    paths:
      - ai-summaries.py
      - spec-activity.py
      - staff.json
      - tests/**
      - .github/workflows/tests.yaml

# Actions are pinned to full commit SHAs (version in the comment).
permissions:
  contents: read

jobs:
  pytest:
    name: ai-summaries and spec-activity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --quiet -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest -q tests
