name: Deploy Web UI

on:
  push:
    branches: ["main"]
    paths:
      - "web-ui/**"
      - ".github/workflows/deploy-pages.yaml"
  # Always redeploy after the data fetch, so the published UI can never lag the
  # data. Relying on the push trigger alone is not safe: "Daily Data Fetch"
  # commits with --allow-empty, and an empty commit matches no path filter.
  workflow_run:
    workflows: ["Daily Data Fetch"]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on every completion, including failures. Only deploy
    # when the data fetch was green; other triggers are unaffected.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        working-directory: web-ui
        run: npm ci

      - name: Build
        working-directory: web-ui
        run: npm run build
        env:
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web-ui/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
