name: Daily Data Fetch

on:
  schedule:
    # This will run at 00:00, 08:00, and 16:00 UTC
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Text for the Release Notes line of the data release"
        required: false
        default: ""
        type: string

# Nothing by default; each job asks only for what it needs. Actions are pinned
# to full commit SHAs (version in the comment) so a moved tag cannot change
# the code that runs next to the secrets.
permissions: {}

jobs:
  data-fetch:
    name: Collect Data from Jira
    runs-on: ubuntu-latest
    permissions:
      # Create Release uses this job's GITHUB_TOKEN (the action's token input).
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GHTOKEN }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA::7})" >> $GITHUB_ENV

      - name: Get current date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Get current time
        run: echo "CURRENT_TIME=$(date +'%H%M%S')" >> $GITHUB_ENV

      - name: Build Container Image
        id: build_container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: riscvintl/bod-jira-data-image:latest

      - name: Run Container
        id: run_container
        if: steps.build_container.outcome == 'success'
        run: docker run --rm -e JIRA_TOKEN=${{ secrets.JIRATOKEN }} -e JIRA_EMAIL=${{ secrets.JIRA_EMAIL }} -e GHTOKEN=${{ secrets.GHTOKEN }} -v ./:/usr/src/app/ riscvintl/bod-jira-data-image:latest

      - name: Upload Data
        if: steps.run_container.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
            name: spec-data.csv
            path: ${{ github.workspace }}/*.csv

      - name: Create Release
        if: steps.run_container.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          tag_name: bod-jira-data-${{ env.SHORT_SHA }}-${{ env.CURRENT_DATE }}-${{ env.CURRENT_TIME }}
          name: ${{ env.CURRENT_TIME }}
          body: |
            This release was created by: ${{ github.event.sender.login }}
            Release Notes: ${{ inputs.release_notes }}
          files: |
            ${{ github.workspace }}/*.csv


      - name: Update latest CSV for UI
        if: steps.run_container.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          set -euo pipefail
          latest_csv=$(ls -t specs_*.csv | head -n1 || true)
          if [ -z "$latest_csv" ]; then
            echo "No specs_*.csv found."
            exit 1
          fi
          mkdir -p web-ui/public
          cp "$latest_csv" web-ui/public/latest.csv
          # Specs ratified this year (the CSV leaves them out); optional.
          if [ -f ratified.json ]; then cp ratified.json web-ui/public/ratified.json; fi
          printf "updated_at=%s\nrun_id=%s\n" \
            "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            "${GITHUB_RUN_ID}" \
            > web-ui/public/latest.csv.meta

      - name: Pass the UI data to the next jobs
        if: steps.run_container.outcome == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-data
          path: |
            web-ui/public/latest.csv
            web-ui/public/latest.csv.meta
            web-ui/public/ratified.json
          retention-days: 1

  # A short summary per spec, written by a model on Amazon Bedrock from the
  # facts in the CSV and cached by their hash; see ai-summaries.py. This job
  # holds the AWS OIDC token and no other secret, so a problem here cannot
  # reach the Jira or GitHub tokens. A failure keeps the old summaries.
  summaries:
    name: Write AI summaries
    needs: data-fetch
    # Branch runs are for testing the fetch only; the AWS roles trust main anyway.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the UI data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-data
          path: web-ui/public

      - name: Configure AWS credentials for Bedrock
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write AI summaries
        env:
          BEDROCK_MODEL_ID: qwen.qwen3-next-80b-a3b
        run: |
          set -euo pipefail
          pip install --quiet boto3==1.43.115
          python ai-summaries.py web-ui/public/latest.csv --out web-ui/public/summaries.json

      - name: Pass the summaries to the landing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summaries
          path: web-ui/public/summaries.json
          retention-days: 1

  # How active each spec was over the last 90 days, from Jira, GitHub,
  # Groups.io and Confluence (spec-activity.py). It needs the Jira and GitHub
  # tokens plus the Groups.io login, so it runs apart from the AWS jobs. It
  # takes about 7 minutes (Groups.io answers slowly, so 6 specs run at once).
  # After 25 minutes it stops and keeps the last result for the specs left;
  # a failure keeps the old activity.json.
  activity:
    name: Measure spec activity
    needs: data-fetch
    if: needs.data-fetch.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the UI data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-data
          path: web-ui/public

      - name: Measure spec activity
        env:
          JIRA_TOKEN: ${{ secrets.JIRATOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          GHTOKEN: ${{ secrets.GHTOKEN }}
          GROUPSIO_USER: ${{ secrets.GROUPSIO_USER }}
          GROUPSIO_PASSWORD: ${{ secrets.GROUPSIO_PASSWORD }}
        run: |
          set -euo pipefail
          pip install --quiet requests==2.32.3
          python spec-activity.py web-ui/public/latest.csv --out web-ui/public/activity.json --budget-minutes 25

      - name: Pass the activity to the landing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity
          path: web-ui/public/activity.json
          retention-days: 1

  # One snapshot per spec per day in DynamoDB (snapshot-history.py), then the
  # weekly "what changed" digest built from it (weekly-digest.py). Like the
  # summaries job, this job holds only an AWS OIDC token, for a role that can
  # read and write the history table and nothing else. The role trusts main
  # only, so runs dispatched from other branches fail here, by design; a
  # failure keeps the old changes.json.
  history:
    name: Store history and write the weekly digest
    needs: data-fetch
    # Branch runs are for testing the fetch only; the AWS roles trust main anyway.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the UI data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-data
          path: web-ui/public

      - name: Configure AWS credentials for the history table
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_HISTORY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Store today's snapshot and write the digest
        run: |
          set -euo pipefail
          pip install --quiet boto3==1.43.115
          python snapshot-history.py web-ui/public/latest.csv
          python weekly-digest.py --out web-ui/public/changes.json

      - name: Pass the digest to the landing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changes
          path: web-ui/public/changes.json
          retention-days: 1

  # A runner's `git commit` is unsigned, so the files are committed through
  # the API (which signs) and landed via a PR (so the DCO app runs). This
  # keeps every commit on the default branch signed and DCO-checked. See the
  # script header for detail.
  #
  # This no longer makes an empty commit when nothing changed. That is safe:
  # Deploy Web UI also triggers on `workflow_run` for this workflow, so the
  # published UI still refreshes even when no commit is produced.
  land:
    name: Land latest CSV via a signed, DCO-checked PR
    needs: [data-fetch, summaries, history, activity]
    # Runs when the summaries or history job failed too; the old
    # summaries.json and changes.json are kept.
    # Only main lands data; a run dispatched from a branch must never write to main.
    if: always() && needs.data-fetch.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the UI data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-data
          path: web-ui/public

      - name: Get the summaries
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: summaries
          path: web-ui/public

      - name: Get the spec activity
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activity
          path: web-ui/public

      - name: Get the weekly digest
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: web-ui/public

      - name: Land the files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- web-ui/public/latest.csv web-ui/public/latest.csv.meta web-ui/public/summaries.json web-ui/public/changes.json web-ui/public/ratified.json web-ui/public/activity.json)" ]; then
            echo "No changes."
            exit 0
          fi
          python .github/scripts/signed_pr_merge.py \
            --path web-ui/public/latest.csv \
            --path web-ui/public/latest.csv.meta \
            $( [ -f web-ui/public/ratified.json ] && echo --path web-ui/public/ratified.json ) \
            $( [ -f web-ui/public/summaries.json ] && echo --path web-ui/public/summaries.json ) \
            $( [ -f web-ui/public/changes.json ] && echo --path web-ui/public/changes.json ) \
            $( [ -f web-ui/public/activity.json ] && echo --path web-ui/public/activity.json ) \
            --branch-prefix bot/latest-csv \
            --message "Update latest CSV" \
            --pr-body "Automated refresh of the spec dashboard CSV, opened by the Daily Data Fetch workflow so the commit is signed and DCO-checked."
